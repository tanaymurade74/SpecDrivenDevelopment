<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9; /* Light background */
            padding-top: 3rem;
            padding-bottom: 3rem;
        }
        .gallery-image {
            width: 100%;
            height: 250px; /* Fixed height to keep spacing even */
            object-fit: cover; /* Ensures images are not distorted */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery-image:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Heading centered using Bootstrap's text-center -->
        <h1 class="text-center mb-5 fw-bold text-dark">My Photo Gallery</h1>
        
        <!-- g-4 adds equal spacing (gap) between the grid items -->
        <div class="row g-4" id="gallery-container">
            <!-- Photos will be dynamically generated by JS -->
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const galleryContainer = document.getElementById('gallery-container');
        const totalPhotos = 20;

        for (let i = 1; i <= totalPhotos; i++) {
            const col = document.createElement('div');
            // col-12 for mobile, col-md-3 for 4 items per row on medium screens and larger
            col.className = 'col-12 col-sm-6 col-md-3';
            
            const img = document.createElement('img');
            // Fetching random images from picsum.photos
            img.src = `https://picsum.photos/400/300?random=${i}`;
            img.alt = `Random Gallery Photo ${i}`;
            img.className = 'gallery-image';
            img.loading = 'lazy'; // Improves page load performance

            col.appendChild(img);
            galleryContainer.appendChild(col);
        }
    </script>
</body>
</html>
